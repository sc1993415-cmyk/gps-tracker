<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>选手名册管理</title>
    <style>
      :root {
        --bg: #0b0f14;
        --panel: rgba(8, 12, 18, 0.92);
        --border: rgba(255, 255, 255, 0.1);
        --text: #fff;
        --muted: rgba(255, 255, 255, 0.55);
        --accent: #ff3b5c;
        --ok: #7cffb2;
        --input: rgba(255, 255, 255, 0.06);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; min-height: 100%;
        background: var(--bg); color: var(--text);
        font: 14px/1.45 system-ui, "PingFang SC", "Noto Sans SC", sans-serif;
      }
      body { padding: 24px 16px 48px; }
      .wrap { max-width: 920px; margin: 0 auto; }
      h1 {
        margin: 0 0 6px; font: 700 22px/1.2 system-ui, "PingFang SC", sans-serif;
        letter-spacing: 0.02em;
      }
      .sub { color: var(--muted); margin-bottom: 20px; font-size: 13px; }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
        backdrop-filter: blur(10px);
      }
      .panel h2 {
        margin: 0 0 12px;
        font: 600 12px/1 system-ui, "PingFang SC", sans-serif;
        letter-spacing: 0.08em;
        opacity: 0.7;
      }
      form.grid {
        display: grid;
        grid-template-columns: 1.4fr 0.6fr 1fr 0.7fr auto;
        gap: 10px;
        align-items: end;
      }
      @media (max-width: 720px) {
        form.grid { grid-template-columns: 1fr 1fr; }
        form.grid .span-all { grid-column: 1 / -1; }
      }
      label { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 12px; }
      input[type="text"], input[type="color"] {
        width: 100%;
        border: 1px solid var(--border);
        background: var(--input);
        color: var(--text);
        border-radius: 8px;
        padding: 10px 12px;
        font: 500 14px/1.2 system-ui, "PingFang SC", sans-serif;
      }
      input[type="color"] { padding: 4px; height: 40px; cursor: pointer; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      button {
        border: 0; border-radius: 8px; cursor: pointer;
        font: 600 13px/1 system-ui, "PingFang SC", sans-serif;
        padding: 11px 14px; color: #fff;
        background: rgba(255, 255, 255, 0.1);
      }
      button.primary { background: var(--accent); }
      button.danger { background: rgba(255, 59, 92, 0.25); color: #ff8da0; }
      button:hover { filter: brightness(1.08); }
      table { width: 100%; border-collapse: collapse; }
      th, td {
        text-align: left; padding: 10px 8px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      th {
        font: 600 11px/1 system-ui, "PingFang SC", sans-serif;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      td.mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, monospace; font-size: 12px; }
      .swatch {
        display: inline-block; width: 14px; height: 14px;
        border-radius: 50%; vertical-align: middle; margin-right: 8px;
        box-shadow: 0 0 0 2px rgba(255,255,255,0.12);
      }
      .row-actions { display: flex; gap: 6px; }
      #status {
        min-height: 18px; margin-top: 10px;
        font-size: 13px; color: var(--muted);
      }
      #status.ok, #cmd-status.ok { color: var(--ok); }
      #status.err, #cmd-status.err { color: #ff8da0; }
      #cmd-status { min-height: 18px; margin-top: 10px; font-size: 13px; color: var(--muted); }
      .empty { color: var(--muted); padding: 12px 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>选手名册</h1>
      <p class="sub">将 MT909 IMEI（<code>device_id</code>）绑定到 号码牌 / 姓名 / 颜色。保存后写入 <code>roster.json</code> 并热重载接收端。</p>

      <div class="panel">
        <h2>添加 / 编辑</h2>
        <form id="form" class="grid" autocomplete="off">
          <label class="span-all">
            设备号 (IMEI)
            <input id="device_id" type="text" required placeholder="8638… 或 demo-1" />
          </label>
          <label>
            号码牌
            <input id="bib" type="text" placeholder="42" />
          </label>
          <label>
            姓名
            <input id="name" type="text" placeholder="张三" />
          </label>
          <label>
            颜色
            <input id="color" type="color" value="#ff3b5c" />
          </label>
          <div class="actions span-all">
            <button type="submit" class="primary">保存</button>
            <button type="button" id="btn-clear">清空表单</button>
            <button type="button" id="btn-reload">刷新列表</button>
          </div>
        </form>
        <div id="status"></div>
      </div>


      <div class="panel">
        <h2>设备指令下发（MT909 官方短信原文 → TCP）</h2>
        <p class="sub" style="margin-top:0">在线设备走 5013 长连接原样下发；离线则排队，重连后自动 flush。回执看 receiver 日志 <code>[cmd] reply</code>。</p>
        <form id="cmd-form" class="grid" style="grid-template-columns: 1.2fr 0.7fr 0.7fr 0.9fr 0.6fr auto;" autocomplete="off">
          <label>
            设备号
            <input id="cmd_device_id" type="text" required placeholder="7026238813" />
          </label>
          <label>
            指令
            <select id="cmd_kind" style="width:100%;border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:8px;padding:10px 12px;font:500 14px/1.2 system-ui,sans-serif;">
              <option value="freq">FREQ 改间隔</option>
              <option value="ip">IP 改服务器</option>
              <option value="cq">CQ 重启</option>
            </select>
          </label>
          <label id="wrap_pwd">
            密码
            <input id="cmd_password" type="text" value="123456" />
          </label>
          <label id="wrap_interval">
            间隔(秒)
            <input id="cmd_interval" type="text" value="30" placeholder="10–3599" />
          </label>
          <label id="wrap_host" style="display:none">
            服务器 IP
            <input id="cmd_host" type="text" value="114.55.99.34" />
          </label>
          <label id="wrap_port" style="display:none">
            端口
            <input id="cmd_port" type="text" value="5013" />
          </label>
          <div class="actions span-all">
            <button type="submit" class="primary">下发</button>
            <button type="button" id="btn-online">刷新在线</button>
            <span id="online-status" class="sub" style="margin:0;align-self:center;"></span>
          </div>
        </form>
        <div id="cmd-status"></div>
        <pre id="cmd-preview" class="mono" style="margin:10px 0 0;padding:10px;background:var(--input);border-radius:8px;font-size:12px;color:var(--muted);"></pre>
      </div>

      <div class="panel">
        <h2>当前名册</h2>
        <div id="list-wrap">
          <p class="empty">加载中…</p>
        </div>
      </div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      const statusEl = $("status");

      function setStatus(msg, kind) {
        statusEl.textContent = msg || "";
        statusEl.className = kind || "";
      }

      function fillForm(entry) {
        $("device_id").value = entry?.device_id || "";
        $("bib").value = entry?.bib || "";
        $("name").value = entry?.name || "";
        $("color").value = entry?.color || "#ff3b5c";
      }

      async function api(path, opts) {
        const res = await fetch(path, {
          headers: { "Content-Type": "application/json", ...(opts?.headers || {}) },
          ...opts,
        });
        const text = await res.text();
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch { data = text; }
        if (!res.ok) {
          const err = (data && data.error) || res.statusText || "请求失败";
          throw new Error(err);
        }
        return data;
      }

      function render(list) {
        const wrap = $("list-wrap");
        if (!list || !list.length) {
          wrap.innerHTML = '<p class="empty">暂无选手 — 请在上方添加。</p>';
          return;
        }
        wrap.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>设备号 (IMEI)</th>
                <th>号码牌</th>
                <th>姓名</th>
                <th>颜色</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${list.map((e) => `
                <tr data-id="${encodeURIComponent(e.device_id)}">
                  <td class="mono">${escapeHtml(e.device_id)}</td>
                  <td>${escapeHtml(e.bib || "")}</td>
                  <td>${escapeHtml(e.name || "")}</td>
                  <td><span class="swatch" style="background:${escapeAttr(e.color || "#ff3b5c")}"></span>${escapeHtml(e.color || "")}</td>
                  <td class="row-actions">
                    <button type="button" data-act="edit">编辑</button>
                    <button type="button" class="danger" data-act="del">删除</button>
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
        wrap.querySelectorAll("button[data-act]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const tr = btn.closest("tr");
            const id = decodeURIComponent(tr.getAttribute("data-id"));
            const entry = list.find((x) => x.device_id === id);
            if (btn.getAttribute("data-act") === "edit") {
              fillForm(entry);
              setStatus(`正在编辑 ${id}`, "");
              return;
            }
            if (!confirm(`确定删除 ${id}？`)) return;
            try {
              const next = await api(`/api/roster/${encodeURIComponent(id)}`, { method: "DELETE" });
              setStatus(`已删除 ${id}`, "ok");
              render(next);
            } catch (err) {
              setStatus(String(err.message || err), "err");
            }
          });
        });
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function escapeAttr(s) {
        return escapeHtml(s).replace(/'/g, "&#39;");
      }

      async function reload() {
        try {
          const list = await api("/api/roster");
          render(list);
          setStatus(`已加载 ${list.length} 条`, "ok");
        } catch (err) {
          setStatus(String(err.message || err), "err");
        }
      }

      $("form").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const entry = {
          device_id: $("device_id").value.trim(),
          bib: $("bib").value.trim(),
          name: $("name").value.trim(),
          color: $("color").value,
        };
        if (!entry.device_id) {
          setStatus("设备号 (IMEI) 为必填项", "err");
          return;
        }
        try {
          const next = await api("/api/roster", {
            method: "POST",
            body: JSON.stringify(entry),
          });
          setStatus(`已保存 ${entry.device_id}`, "ok");
          render(next);
        } catch (err) {
          setStatus(String(err.message || err), "err");
        }
      });

      $("btn-clear").addEventListener("click", () => {
        fillForm(null);
        setStatus("", "");
      });
      $("btn-reload").addEventListener("click", reload);

      reload();
    
      // --- MT909 command downlink ---
      const cmdStatus = $("cmd-status");
      function setCmdStatus(msg, kind) {
        cmdStatus.textContent = msg || "";
        cmdStatus.className = kind || "";
      }
      function syncCmdFields() {
        const kind = $("cmd_kind").value;
        $("wrap_pwd").style.display = kind === "freq" ? "" : "none";
        $("wrap_interval").style.display = kind === "freq" ? "" : "none";
        $("wrap_host").style.display = kind === "ip" ? "" : "none";
        $("wrap_port").style.display = kind === "ip" ? "" : "none";
        let preview = "";
        if (kind === "freq") preview = `FREQ,${$("cmd_password").value || "123456"},${$("cmd_interval").value || "30"}`;
        else if (kind === "ip") preview = `IP ${$("cmd_host").value || "…"} ${$("cmd_port").value || "5013"}`;
        else preview = "CQ";
        $("cmd-preview").textContent = "将发送： " + preview;
      }
      $("cmd_kind").addEventListener("change", syncCmdFields);
      ["cmd_password","cmd_interval","cmd_host","cmd_port"].forEach((id) => {
        $(id).addEventListener("input", syncCmdFields);
      });
      syncCmdFields();

      async function refreshOnline() {
        try {
          const data = await api("/api/devices/online");
          const list = data.online || [];
          $("online-status").textContent = list.length
            ? ("在线: " + list.join(", "))
            : "当前无在线设备";
          if (list.length && !$("cmd_device_id").value) $("cmd_device_id").value = list[0];
        } catch (err) {
          $("online-status").textContent = "在线查询失败: " + err.message;
        }
      }
      $("btn-online").addEventListener("click", refreshOnline);
      refreshOnline();

      $("cmd-form").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const kind = $("cmd_kind").value;
        const body = { device_id: $("cmd_device_id").value.trim(), cmd: kind };
        if (kind === "freq") {
          body.password = $("cmd_password").value.trim() || "123456";
          body.interval = Number($("cmd_interval").value);
        } else if (kind === "ip") {
          body.host = $("cmd_host").value.trim();
          body.port = Number($("cmd_port").value);
        }
        try {
          setCmdStatus("下发中…");
          const data = await api("/api/command", { method: "POST", body: JSON.stringify(body) });
          const q = data.queued ? "（已排队，等设备上线）" : "（已写入 TCP）";
          setCmdStatus(`已下发 ${data.command} ${q}`, "ok");
          refreshOnline();
        } catch (err) {
          setCmdStatus(err.message || String(err), "err");
        }
      });

</script>
  </body>
</html>
