<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>gps-tracker overlay</title>
    <style>
      :root {
        --hud-pad: 16px;
        --hud-font: 28px;
        --flag-font: 16px;
        --dot-size: 14px;
        --list-w: 280px;
      }
      html.large-mode {
        --hud-pad: 22px;
        --hud-font: 40px;
        --flag-font: 22px;
        --dot-size: 18px;
        --list-w: 320px;
      }
      html, body, #map { margin: 0; height: 100%; background: #071427; }
      body { overflow: hidden; font-family: system-ui, sans-serif; }
      #top-bar {
        position: absolute; top: 0; left: 0; right: 0; z-index: 5;
        display: flex; align-items: center; gap: 12px;
        padding: 10px 16px;
        background: linear-gradient(180deg, rgba(8,12,18,0.85), transparent);
        color: #fff; pointer-events: none;
      }
      #event-name { font: 700 18px/1.2 system-ui, sans-serif; letter-spacing: 0.02em; }
      #live-badge {
        display: none; align-items: center; gap: 6px;
        background: #ff3b5c; color: #fff;
        font: 700 11px/1 system-ui, sans-serif;
        padding: 4px 8px; border-radius: 4px; letter-spacing: 0.08em;
      }
      #live-badge.show { display: inline-flex; }
      #live-badge.replay { background: #5b7cfa; }
      #live-badge.replay::before { animation: none; opacity: 0.85; }
      #live-badge::before {
        content: ""; width: 6px; height: 6px; border-radius: 50%;
        background: #fff; box-shadow: 0 0 6px #fff;
        animation: pulse 1.2s ease-in-out infinite;
      }
      #playback-bar {
        display: none; position: absolute; left: 50%; bottom: 88px; z-index: 6;
        transform: translateX(-50%);
        align-items: center; gap: 10px;
        padding: 8px 12px; border-radius: 10px;
        background: rgba(8,12,18,0.88); color: #fff;
        backdrop-filter: blur(10px);
        font: 500 12px system-ui, sans-serif;
        pointer-events: auto;
      }
      #playback-bar.show { display: flex; }
      #playback-bar input[type=range] { width: min(42vw, 320px); }
      #playback-bar button {
        border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer;
        background: rgba(255,255,255,0.12); color: #fff; font: 600 12px system-ui, sans-serif;
      }
      #playback-bar button.active { background: #5b7cfa; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      #list-panel {
        position: absolute; top: 52px; left: 12px; bottom: 110px; z-index: 5;
        width: var(--list-w);
        display: flex; flex-direction: column;
        background: linear-gradient(180deg, rgba(12, 32, 58, 0.82), rgba(7, 20, 39, 0.78));
        border: 1px solid rgba(140, 190, 255, 0.16);
        border-radius: 14px;
        backdrop-filter: blur(16px) saturate(1.2);
        box-shadow: 0 12px 40px rgba(0, 12, 32, 0.35);
        color: #fff; overflow: hidden;
        transition: width 0.2s ease, opacity 0.2s ease;
      }
      #list-panel.collapsed { width: 36px; }
      #list-panel.collapsed #participant-list,
      #list-panel.collapsed .list-header span { display: none; }
      .list-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 10px 10px 6px; font: 600 12px system-ui, sans-serif;
        opacity: 0.75; text-transform: uppercase; letter-spacing: 0.06em;
      }
      #list-toggle {
        border: 0; background: rgba(255,255,255,0.08); color: #fff;
        width: 28px; height: 28px; border-radius: 8px; cursor: pointer;
        font-size: 16px; line-height: 1;
      }
      #participant-list {
        flex: 1; overflow: auto; padding: 4px 8px 10px;
        display: flex; flex-direction: column; gap: 4px;
      }
      .participant-item {
        display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
        width: 100%; border: 0; border-radius: 8px;
        background: transparent; color: #fff;
        padding: 8px 8px; cursor: pointer; text-align: left;
        font: 500 13px system-ui, sans-serif;
      }
      .participant-item:hover { background: rgba(80,140,220,0.12); }
      .participant-item.active {
        background: linear-gradient(90deg, rgba(61,139,253,0.28), rgba(61,139,253,0.08));
        box-shadow: inset 3px 0 0 #3d8bfd, 0 0 0 1px rgba(61,139,253,0.35);
      }
      .participant-item .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
      .participant-item .rank {
        display: inline-flex; align-items: center; gap: 4px;
        min-width: 2.4em; font-variant-numeric: tabular-nums; font-weight: 700;
      }
      .rank-arrow { font-size: 10px; }
      .rank-arrow.up { color: #7cffb2; }
      .rank-arrow.down { color: #ff8da0; }
      .rank-arrow.flat { color: rgba(255,255,255,0.35); }
      .participant-item .bib { opacity: 0.7; font-variant-numeric: tabular-nums; min-width: 1.6em; }
      .participant-item .name { flex: 1 1 72px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .participant-item .online { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-left: auto; }
      .participant-item .online.fixing { background: #7cffb2; }
      .participant-item .online.no-fix { background: #ffd166; }
      .participant-item .online.on { background: #7cffb2; }
      .participant-item .progress,
      .participant-item .speed,
      .participant-item .battery,
      .participant-item .lastUpdate {
        opacity: 0.65; font-variant-numeric: tabular-nums; font-size: 11px; white-space: nowrap;
      }
      .participant-item .speed small { opacity: 0.7; margin-left: 1px; font-size: 9px; }
      .participant-item .offCourse {
        font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
        color: #ff8da0; background: rgba(255,59,92,0.2);
        padding: 2px 6px; border-radius: 4px; white-space: nowrap;
      }
      .participant-item .online.off { background: #666; }
      .participant-item .online.lbs { background: #7cffb2; }
      .participant-item .lbs-tag { font-size: 10px; color: #7cffb2; margin-left: 4px; font-weight: 600; }
      #hud {
        position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 5;
        display: flex; flex-wrap: wrap; gap: 18px 28px; padding: var(--hud-pad) 18px;
        background: linear-gradient(180deg, rgba(12, 32, 58, 0.78), rgba(7, 20, 39, 0.72));
        color: #eef5ff;
        font: 600 var(--hud-font)/1.1 system-ui, "PingFang SC", sans-serif;
        border-radius: 16px;
        border: 1px solid rgba(140, 190, 255, 0.16);
        backdrop-filter: blur(16px) saturate(1.2);
        box-shadow: 0 16px 48px rgba(0, 12, 32, 0.4);
      }
      #hud.hidden { display: none; }
      #hud span {
        opacity: 0.52; font-size: 11px; font-weight: 600; display: block;
        letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px;
      }
      #hud .hud-item { min-width: 72px; padding-right: 8px; }
      #hud .hud-item + .hud-item { border-left: 1px solid rgba(140,190,255,0.12); padding-left: 20px; }
      #hud .hud-flag { font-size: 32px; line-height: 1; }
      #hud img.hud-flag-img { width: 32px; height: 24px; display: block; border-radius: 3px; }
      .course-end { display: flex; flex-direction: column; align-items: center; pointer-events: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,.35)); }
      .course-end .ce-flag { line-height: 0; }
      .course-end .ce-label {
        margin-top: -2px; padding: 2px 6px; border-radius: 4px;
        font: 800 10px/1.1 system-ui, sans-serif; letter-spacing: .04em; color: #fff;
      }
      .course-end .ce-label.start { background: #16a34a; }
      .course-end .ce-label.finish { background: #111; }
      .course-end .ce-label.both { background: #0f172a; }
      .athlete-marker { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
      .athlete-marker.hidden-marker { display: none; }
      .athlete-flag {
        display: none; background: var(--dot-color, #ff3b5c); color: #fff;
        padding: 6px 10px; border-radius: 8px;
        font: 700 var(--flag-font)/1.1 system-ui, sans-serif;
        margin-bottom: 4px; white-space: nowrap;
        box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      }
      .athlete-marker.selected .athlete-flag { display: block; }
      .athlete-dot {
        width: var(--dot-size); height: var(--dot-size); border-radius: 50%;
        background: var(--dot-color, #ff3b5c); border: 3px solid #fff;
        box-shadow: 0 0 12px var(--dot-color, #ff3b5c);
      }
      .athlete-marker.selected .athlete-dot {
        width: calc(var(--dot-size) + 6px); height: calc(var(--dot-size) + 6px);
      }
      .athlete-marker.lbs .athlete-dot {
        background: #22c55e;
        box-shadow: 0 0 14px #22c55e;
        border-color: #ecfdf3;
      }
      .participant-item .online.coast { background: #ffb020; }
      .participant-item .coast-tag { font-size: 10px; color: #ffb020; margin-left: 4px; font-weight: 600; }
      .athlete-marker.coast .athlete-dot {
        background: #ffb020;
        box-shadow: 0 0 0 3px rgba(255,176,32,0.35);
      }
      .athlete-marker.coast .athlete-flag { color: #ffb020; }
      .athlete-marker.lbs .athlete-flag {
        background: #15803d;
      }
      html.map-only #top-bar,
      html.map-only #list-panel { display: none !important; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="top-bar">
      <div id="event-name">Race Live</div>
      <div id="live-badge">LIVE</div>
    </div>
    <div id="playback-bar">
      <button type="button" id="pb-toggle">播放</button>
      <input id="pb-scrub" type="range" min="0" max="1000" value="0" />
      <span id="pb-time">0:00</span>
      <button type="button" class="pb-speed active" data-speed="1">1×</button>
      <button type="button" class="pb-speed" data-speed="2">2×</button>
      <button type="button" class="pb-speed" data-speed="5">5×</button>
    </div>
    <aside id="list-panel">
      <div class="list-header">
        <span>选手</span>
        <button id="list-toggle" type="button" title="收起">&#8249;</button>
      </div>
      <div id="participant-list"></div>
    </aside>
    <div id="hud" class="hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
